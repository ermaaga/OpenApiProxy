<svg width="100%" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>openproxy banner</title>
  <desc>Banner per il progetto openproxy — local proxy che traduce Anthropic Messages API in OpenAI format</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      @keyframes dash { to { stroke-dashoffset: -24; } }
      .flow { stroke-dasharray: 6 4; animation: dash 1.8s linear infinite; }
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="320" rx="16" fill="#0D1117"/>
  <line x1="0" y1="160" x2="680" y2="160" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="320" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Claude Code box -->
  <rect x="32" y="108" width="140" height="104" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <circle cx="52" cy="124" r="4" fill="#FF5F57"/>
  <circle cx="66" cy="124" r="4" fill="#FFBD2E"/>
  <circle cx="80" cy="124" r="4" fill="#28CA41"/>
  <rect x="46" y="138" width="64" height="4" rx="2" fill="#ffffff" opacity="0.12"/>
  <rect x="46" y="148" width="88" height="4" rx="2" fill="#1D9E75" opacity="0.7"/>
  <rect x="46" y="158" width="48" height="4" rx="2" fill="#ffffff" opacity="0.08"/>
  <rect x="46" y="168" width="76" height="4" rx="2" fill="#378ADD" opacity="0.6"/>
  <text font-family="ui-monospace, monospace" font-size="11" fill="#C9D1D9" x="102" y="210" text-anchor="end" opacity="0.9">claude</text>
  <text font-family="ui-monospace, monospace" font-size="11" fill="#8B949E" x="52" y="224" opacity="0.7">Claude Code</text>

  <!-- openproxy center box -->
  <rect x="260" y="86" width="160" height="148" rx="12" fill="#0F3460" stroke="#1D6FAB" stroke-width="1.2"/>
  <path d="M316 132 A24 24 0 0 1 364 132" fill="none" stroke="#378ADD" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M364 148 A24 24 0 0 1 316 148" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="295" y="162" width="90" height="18" rx="4" fill="#185FA5" opacity="0.6"/>
  <text font-family="ui-monospace, monospace" font-size="10" fill="#85B7EB" x="340" y="175" text-anchor="middle">:4000</text>
  <text font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="#FFFFFF" x="340" y="218" text-anchor="middle" letter-spacing="-0.5">openproxy</text>
  <text font-family="ui-monospace, monospace" font-size="9" fill="#378ADD" x="340" y="230" text-anchor="middle" letter-spacing="2">LOCAL PROXY</text>

  <!-- Provider box -->
  <rect x="508" y="108" width="140" height="104" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text font-family="ui-monospace, monospace" font-size="10" fill="#8B949E" x="526" y="132" opacity="0.8">providers</text>
  <rect x="522" y="140" width="64" height="18" rx="4" fill="#1B3A1F"/>
  <text font-family="ui-monospace, monospace" font-size="9" fill="#28CA41" x="554" y="153" text-anchor="middle">NVIDIA NIM</text>
  <rect x="522" y="164" width="48" height="18" rx="4" fill="#1A2A3A"/>
  <text font-family="ui-monospace, monospace" font-size="9" fill="#378ADD" x="546" y="177" text-anchor="middle">OpenAI</text>
  <rect x="578" y="164" width="36" height="18" rx="4" fill="#2A1A3A"/>
  <text font-family="ui-monospace, monospace" font-size="9" fill="#A78BFA" x="596" y="177" text-anchor="middle">Groq</text>
  <text font-family="ui-monospace, monospace" font-size="9" fill="#8B949E" x="578" y="207">+ any OpenAI</text>
  <text font-family="ui-monospace, monospace" font-size="9" fill="#8B949E" x="578" y="218">compatible</text>

  <!-- Flows -->
  <line class="flow" x1="172" y1="160" x2="256" y2="160" stroke="#1D9E75" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text font-family="ui-monospace, monospace" font-size="9" fill="#1D9E75" x="214" y="150" text-anchor="middle" opacity="0.9">Anthropic</text>
  <text font-family="ui-monospace, monospace" font-size="9" fill="#1D9E75" x="214" y="142" text-anchor="middle" opacity="0.6">format</text>
  <line class="flow" x1="420" y1="148" x2="504" y2="148" stroke="#378ADD" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text font-family="ui-monospace, monospace" font-size="9" fill="#378ADD" x="462" y="140" text-anchor="middle" opacity="0.9">OpenAI</text>
  <text font-family="ui-monospace, monospace" font-size="9" fill="#378ADD" x="462" y="132" text-anchor="middle" opacity="0.6">format</text>
  <line class="flow" x1="504" y1="172" x2="420" y2="172" stroke="#1D9E75" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text font-family="ui-monospace, monospace" font-size="9" fill="#1D9E75" x="462" y="195" text-anchor="middle" opacity="0.7">translated back</text>

  <!-- Tagline -->
  <text font-family="ui-monospace, monospace" font-size="11" fill="#8B949E" x="340" y="290" text-anchor="middle">drop-in endpoint for Claude Code · streaming · tool use · any provider</text>

  <!-- Badges -->
  <rect x="516" y="20" width="62" height="18" rx="4" fill="#1B3A1F"/>
  <text font-family="ui-monospace, monospace" font-size="9" fill="#28CA41" x="547" y="33" text-anchor="middle">Apache 2.0</text>
  <rect x="584" y="20" width="56" height="18" rx="4" fill="#1A2A3A"/>
  <text font-family="ui-monospace, monospace" font-size="9" fill="#378ADD" x="612" y="33" text-anchor="middle">Node ≥ 18</text>
  <rect x="448" y="20" width="62" height="18" rx="4" fill="#2A1A1A"/>
  <text font-family="ui-monospace, monospace" font-size="9" fill="#E88A5A" x="479" y="33" text-anchor="middle">npm install</text>
</svg>
